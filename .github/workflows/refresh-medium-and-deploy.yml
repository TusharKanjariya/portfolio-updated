name: Refresh Medium posts and deploy

on:
  push:
    branches:
      - main
  schedule:
    # GitHub schedules use UTC. 18:30 UTC equals 00:00 IST.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh Medium posts
        run: node scripts/update-medium-posts.mjs

      - name: Validate generated files
        run: |
          node --check scripts/update-medium-posts.mjs
          node --check script.js
          git diff --check

      - name: Commit refreshed posts
        run: |
          if git diff --quiet -- index.html sitemap.xml; then
            echo "Medium posts are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "chore: refresh Medium posts"
          git push

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js robots.txt sitemap.xml humans.txt _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
